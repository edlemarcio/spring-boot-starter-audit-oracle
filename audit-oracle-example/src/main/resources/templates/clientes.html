<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes — Audit Oracle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">Clientes</h1>
            <p class="text-secondary mb-0">CRUD demonstrativo com auditoria por triggers Oracle</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/}">Início</a>
    </div>

    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

    <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Cadastrar / editar cliente</h2>
            <form th:action="@{/clientes}" th:object="${cliente}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">
                <div class="col-md-3">
                    <label class="form-label" for="cpf">CPF</label>
                    <input class="form-control" id="cpf" th:field="*{cpf}" maxlength="11" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="nome">Nome</label>
                    <input class="form-control" id="nome" th:field="*{nome}" maxlength="200" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="email">E-mail</label>
                    <input class="form-control" id="email" type="email" th:field="*{email}" maxlength="255">
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <a class="btn btn-link" th:href="@{/clientes}">Limpar</a>
                </div>
            </form>
        </div>
    </section>

    <section class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>CPF</th><th>Nome</th><th>E-mail</th><th class="text-end">Ações</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${clientes}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.cpf}"></td>
                    <td th:text="${item.nome}"></td>
                    <td th:text="${item.email}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/{id}/editar(id=${item.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/clientes/{id}/excluir(id=${item.id})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5" class="text-center text-secondary py-4">Nenhum cliente cadastrado.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
