<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit Oracle — Demonstração</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <section class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5">
                    <span class="badge text-bg-primary mb-3">Spring Boot Starter</span>
                    <h1 class="display-5 fw-semibold">Auditoria Oracle com identidade do usuário</h1>
                    <p class="lead text-secondary mt-3">
                        Demonstração de auditoria transacional com metadados de sessão Oracle,
                        triggers e identidade autenticada.
                    </p>
                    <div th:if="${authenticated}" class="alert alert-success mt-4">
                        <strong>Bem-vindo(a),</strong>
                        <span th:text="${username}">usuário</span>
                    </div>
                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <a class="btn btn-primary btn-lg" th:if="${!authenticated}"
                           th:href="@{/oauth2/authorization/demo-oidc}">Entrar</a>
                        <a class="btn btn-primary" th:if="${authenticated}"
                           th:href="@{/clientes}">Abrir CRUD de clientes</a>
                        <a class="btn btn-outline-secondary" th:if="${authenticated}"
                           th:href="@{/auditoria}">Consultar auditoria</a>
                        <form th:if="${authenticated}" th:action="@{/logout}" method="post">
                            <button class="btn btn-outline-danger" type="submit">Sair</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
