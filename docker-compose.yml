services:
  oracle:
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/enterprise:19.3.0.0}
    container_name: audit-oracle-db
    environment:
      ORACLE_SID: ${ORACLE_SID:-ORCLCDB}
      ORACLE_PDB: ${ORACLE_PDB:-ORCLPDB1}
      ORACLE_PWD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1521'"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 5m

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: audit-oracle-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro

volumes:
  oracle-data:
